<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妖怪詳細＆ステータス計算</title>
    <style>
        /* メダル全体の土台（144px） */
        .medal-container {
          position: relative;
          width: 144px;
          height: 144px;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        
        /* 重ね合わせるための基本設定 */
        .medal-container img {
          position: absolute;
        }
        
        /* 1. キャラクター（128px） */
        .layer-char {
          width: 128px;
          height: 128px;
        }
        
        /* 2. 種族背景（128px） */
        .layer-bg {
          width: 128px;
          height: 128px;
        }
        
        /* 3. レアリティフレーム（144px） */
        .layer-frame {
          width: 144px;
          height: 144px;
        }
        body { font-family: sans-serif; background: #1a1d20; padding: 20px; color: #f8f9fa; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #4dabf7; text-decoration: none; font-weight: bold; }
        .container { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "name calc" "info calc"; gap: 20px; max-width: 1200px; align-items: start; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; grid-template-areas: "name" "calc" "info"; } }
        .name-box { grid-area: name; }
        .calc-box { grid-area: calc; }
        .info-box { grid-area: info; }
        .name-box, .info-box, .calc-box { background: #212529; padding: 25px; border-radius: 8px; border: 1px solid #343a40; }
        h2, h3 { margin-top: 0; color: #fff; border-bottom: 2px solid #343a40; padding-bottom: 8px; }
        .yokai-image-space { background: #2b3035; height: 180px; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: 1px dashed #495057; margin-top: 10px; overflow: hidden; }
        .yokai-image-space img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .input-group { display: flex; align-items: center; margin-bottom: 12px; }
        .input-group label { width: 120px; font-weight: bold; font-size: 14px; }
        .input-group input[type="number"] { width: 80px; padding: 6px; background: #2b3035; border: 1px solid #495057; color: white; border-radius: 4px; font-size: 15px; }
        .iv-total { background: #2b3035; padding: 10px; border-radius: 4px; margin-top: 15px; font-size: 14px; font-weight: bold; }
        .warning { color: #ff6b6b; font-size: 13px; margin-top: 8px; display: none; line-height: 1.4; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; }
        .result-table th, .result-table td { border: 1px solid #343a40; padding: 10px; font-size: 15px; }
        .result-table th { background: #2b3035; color: #adb5bd; }
        .result-table td { font-weight: bold; font-size: 18px; color: #4dabf7; }
    </style>
</head>
<body>

    <a href="search.html" class="back-btn">⬅ 検索一覧に戻る</a>

    <div class="container">
        <div class="name-box">
            <span id="yokaiId" style="font-size:14px; color:#adb5bd; float:right; font-weight:bold;"></span>
            <span id="yokaiFurigana" style="font-size:14px; color:#868e96; display:block;"></span>
            <h2 id="yokaiName" style="margin: 5px 0 15px 0; border-bottom: none; padding-bottom: 0;">妖怪名</h2>
            <div style="display: flex; justify-content: center; padding: 20px 0;">
            <div class="medal-container">
                <img src="" class="layer-char" id="yokaiImage">
                <img src="" class="layer-bg" id="medalBg">
                <img src="" class="layer-frame" id="medalFrame">
            </div>
        </div>

        <div class="calc-box">
            <h3>📊 ステータスシミュレーター</h3>
            <div class="input-group"><label>レベル</label><input type="number" id="inputLevel" min="1" max="99" value="99"></div>
            <h4 style="margin: 20px 0 10px 0; color: #adb5bd;">各ステータスの個体値入力</h4>
            <div class="input-group"><label>HP 個体値</label><input type="number" id="ivHP" min="0" max="40" value="20"></div>
            <div class="input-group"><label>ちから 個体値</label><input type="number" id="ivStr" min="0" max="40" value="10"></div>
            <div class="input-group"><label>ようりょく 個体値</label><input type="number" id="ivMag" min="0" max="40" value="10"></div>
            <div class="input-group"><label>まもり 個体値</label><input type="number" id="ivDef" min="0" max="40" value="10"></div>
            <div class="iv-total">
                個体値合計 (HP/2 + 力 + 妖 + 守): <span id="ivTotalVal">40</span> / 40
                <div id="ivWarning" class="warning"></div>
            </div>
            <table class="result-table">
                <thead><tr><th>HP</th><th>ちから</th><th>ようりょく</th><th>まもり</th><th>すばやさ</th></tr></thead>
                <tbody><tr><td id="resHP">-</td><td id="resStr">-</td><td id="resMag">-</td><td id="resDef">-</td><td id="resSpd" style="color:white; font-size:15px;">-</td></tr></tbody>
            </table>
        </div>

        <div class="info-box">
            <h3>📝 基本データ</h3>
            <p><strong>種族:</strong> <span id="yokaiTribe"></span></p>
            <p><strong>役割:</strong> <span id="yokaiRole"></span></p>
            <p><strong>ランク:</strong> <span id="yokaiRank"></span></p>
            <h3>💡 スキル・技情報</h3>
            <p><strong>スキル:</strong> <span id="yokaiSkill"></span></p>
            <p><strong>説明:</strong> <span id="yokaiSkillDesc"></span></p>
        </div>
    </div>

    <script src="data.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const yokaiId = params.get('id') || "001"; 
        // data.js の中から該当する妖怪データを引っ張ってくる
        const yokai = yokaiDatabase[yokaiId];

        function calculateStatus(speciesA, speciesB, level, iv) {
            const c = Math.fround(0.010204081423580647);
            let lvlMinus1 = Math.fround(level - 1);
            let diff = Math.fround(iv + speciesB - speciesA);
            let part1 = Math.fround(c * lvlMinus1);
            let part2 = Math.fround(part1 * diff);
            let finalFloat = Math.fround(Math.fround(speciesA) + part2);
            return Math.floor(finalFloat);
        }

        function updateScreen() {
            if (!yokai) return;
            document.getElementById('yokaiId').innerText = "辞典番号: #" + yokaiId;
            document.getElementById('yokaiName').innerText = yokai.name;
            document.getElementById('yokaiFurigana').innerText = yokai.furigana;
            document.getElementById('yokaiImage').src = yokai.image;
            document.getElementById('medalBg').src    = yokai.bg_image;
            document.getElementById('medalFrame').src = yokai.frame_image;
            document.getElementById('yokaiTribe').innerText = yokai.tribe + "族";
            document.getElementById('yokaiRole').innerText = yokai.role;
            document.getElementById('yokaiRank').innerText = yokai.rank;
            document.getElementById('yokaiSkill').innerText = yokai.skill_name;
            document.getElementById('yokaiSkillDesc').innerText = yokai.skill_desc;

            const imgEl = document.getElementById('yokaiImage');
            const txtEl = document.getElementById('noImageText');
            if (yokai.image) {
                imgEl.src = yokai.image;
                imgEl.style.display = 'block';
                txtEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                txtEl.style.display = 'block';
                txtEl.innerText = "❌ 画像が登録されていません";
            }

            const level = parseInt(document.getElementById('inputLevel').value) || 1;
            const ivHP = parseInt(document.getElementById('ivHP').value) || 0;
            const ivStr = parseInt(document.getElementById('ivStr').value) || 0;
            const ivMag = parseInt(document.getElementById('ivMag').value) || 0;
            const ivDef = parseInt(document.getElementById('ivDef').value) || 0;

            const ivTotal = (ivHP / 2) + ivStr + ivMag + ivDef;
            document.getElementById('ivTotalVal').innerText = ivTotal;
            
            const warningEl = document.getElementById('ivWarning');
            if (ivTotal !== 40) {
                warningEl.style.display = 'block';
                if (ivTotal > 40) {
                    warningEl.innerText = `⚠️ 合計が ${ivTotal} になっています！40を超えており、ゲーム内で存在しない個体値です。`;
                } else {
                    warningEl.innerText = `⚠️ 合計が ${ivTotal} になっています！40未満であり、ゲーム内で存在しない個体値です。`;
                }
            } else {
                warningEl.style.display = 'none';
            }

            document.getElementById('resHP').innerText  = calculateStatus(yokai.status.hp.speciesA,  yokai.status.hp.speciesB,  level, ivHP);
            document.getElementById('resStr').innerText = calculateStatus(yokai.status.str.speciesA, yokai.status.str.speciesB, level, ivStr);
            document.getElementById('resMag').innerText = calculateStatus(yokai.status.mag.speciesA, yokai.status.mag.speciesB, level, ivMag);
            document.getElementById('resDef').innerText = calculateStatus(yokai.status.def.speciesA, yokai.status.def.speciesB, level, ivDef);
            document.getElementById('resSpd').innerText = yokai.status.spd;
        }

        const inputs = ['inputLevel', 'ivHP', 'ivStr', 'ivMag', 'ivDef'];
        inputs.forEach(id => { document.getElementById(id).addEventListener('input', updateScreen); });
        updateScreen();
    </script>
</body>
</html>
