<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妖怪バスターズ 妖怪検索一覧</title>
    <style>
        body { font-family: sans-serif; background: #1a1d20; padding: 20px; color: #f8f9fa; }
        h1 { color: #fff; margin-bottom: 20px; font-size: 24px; }
        .filter-box { background: #212529; padding: 15px; border-radius: 8px; border: 1px solid #343a40; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-input, .filter-select { background: #2b3035; border: 1px solid #495057; color: white; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
        .filter-input { flex: 1; min-width: 200px; }
        .yokai-table { width: 100%; border-collapse: collapse; background: #212529; border-radius: 8px; overflow: hidden; border: 1px solid #343a40; }
        .yokai-table th, .yokai-table td { padding: 12px; text-align: left; border-bottom: 1px solid #343a40; }
        .yokai-table th { background: #2b3035; color: #adb5bd; font-size: 14px; }
        .yokai-table tr:hover { background: #2c3034; }
        .yokai-link { color: #4dabf7; text-decoration: none; font-weight: bold; }
        .yokai-link:hover { text-decoration: underline; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 5px; color: #fff; }
        .bg-プリチー { background: #ff6b6b; }
        .bg-イサマシ { background: #e8590c; }
        .bg-ウスラカゲ { background: #7048e8; }
    </style>
</head>
<body>

    <h1>👻 妖怪バスターズ データ検索</h1>

    <div class="filter-box">
        <input type="text" id="searchInput" class="filter-input" placeholder="妖怪名、または ふりがな で検索...">
        
        <select id="tribeFilter" class="filter-select">
            <option value="">すべての種族</option>
            <option value="イサマシ">イサマシ族</option>
            <option value="プリチー">プリチー族</option>
            <option value="ウスラカゲ">ウスラカゲ族</option>
        </select>

        <select id="roleFilter" class="filter-select">
            <option value="">すべての役割</option>
            <option value="アタッカー">アタッカー</option>
            <option value="タンク">タンク</option>
            <option value="ヒーラー">ヒーラー</option>
            <option value="レンジャー">レンジャー</option>
        </select>
    </div>

    <table class="yokai-table">
        <thead>
            <tr>
                <th>辞典番号</th>
                <th>名前</th>
                <th>種族</th>
                <th>役割</th>
                <th>ランク</th>
                <th>スキル</th>
            </tr>
        </thead>
        <tbody id="yokaiTableBody">
            </tbody>
    </table>

    <script src="data.js"></script>

    <script>
        // data.js のオブジェクトデータを、検索しやすいように配列の形に変形する
        const yokaiData = Object.values(yokaiDatabase);

        function renderTable() {
            const tbody = document.getElementById('yokaiTableBody');
            const searchWord = document.getElementById('searchInput').value.toLowerCase();
            const selectedTribe = document.getElementById('tribeFilter').value;
            const selectedRole = document.getElementById('roleFilter').value;

            tbody.innerHTML = '';

            yokaiData.forEach(yokai => {
                const matchesSearch = yokai.name.includes(searchWord) || yokai.furigana.includes(searchWord);
                const matchesTribe = selectedTribe === "" || yokai.tribe === selectedTribe;
                const matchesRole = selectedRole === "" || yokai.role === selectedRole;

                if (matchesSearch && matchesTribe && matchesRole) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color:#868e96; font-weight:bold;">#${yokai.id}</td>
                        <td><a href="detail.html?id=${yokai.id}" class="yokai-link">${yokai.name}</a></td>
                        <td><span class="badge bg-${yokai.tribe}">${yokai.tribe}族</span></td>
                        <td>${yokai.role}</td>
                        <td style="font-weight:bold; color:#fcc419;">${yokai.rank}</td>
                        <td style="font-size:13px; color:#adb5bd;"><strong>${yokai.skill_name}</strong></td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        }

        // 入力や選択が変わったら即座に再検索
        document.getElementById('searchInput').addEventListener('input', renderTable);
        document.getElementById('tribeFilter').addEventListener('change', renderTable);
        document.getElementById('roleFilter').addEventListener('change', renderTable);

        // 最初の表示
        renderTable();
    </script>
</body>
</html>
