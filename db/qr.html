<meta name="viewport" content="width=device-width,initial-scale=1">
<title>妖怪ウォッチバスターズ QRコード生成</title>
<style>
:root{
  --bg:#f6f7fb; --fg:#1c2230; --sub:#5b6577; --card:#fff; --line:#dde2ec;
  --accent:#e8562a; --accent2:#2a6de8; --chip:#eef1f7; --shadow:0 2px 10px rgba(20,30,60,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c; --fg:#e7ebf3; --sub:#9aa5b8; --card:#1a1f29; --line:#2b3240;
        --chip:#232a36; --shadow:0 2px 12px rgba(0,0,0,.4);}
}
:root[data-theme=dark]{--bg:#12151c;--fg:#e7ebf3;--sub:#9aa5b8;--card:#1a1f29;--line:#2b3240;--chip:#232a36;--shadow:0 2px 12px rgba(0,0,0,.4);}
:root[data-theme=light]{--bg:#f6f7fb;--fg:#1c2230;--sub:#5b6577;--card:#fff;--line:#dde2ec;--chip:#eef1f7;--shadow:0 2px 10px rgba(20,30,60,.08);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:150px}
.btn{background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select{background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cats .btn{padding:5px 10px;font-size:13px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  cursor:pointer;text-align:left;font-family:inherit;color:var(--fg);font-size:14px}
.item:hover{border-color:var(--accent);transform:translateY(-1px)}
.item b{display:block;font-size:15px;margin-bottom:2px}
.item span{color:var(--sub);font-size:12px}
.tag{display:inline-block;background:var(--chip);border-radius:5px;padding:1px 6px;
  font-size:11px;color:var(--sub);margin-left:4px}
.tag.once{background:var(--chip);color:var(--sub)}
/* QR表示部 */
.qrtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qrtop .name{font-size:17px;font-weight:700;flex:1;min-width:120px}
.jump{display:flex;align-items:center;gap:6px}
.jump input{width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
.qrbox{position:relative;display:flex;justify-content:center;align-items:center;gap:8px}
.qrarea{position:relative;background:#fff;border-radius:10px;padding:10px;
  border:1px solid var(--line);line-height:0}
.qrarea svg{display:block;width:min(74vw,320px);height:auto;image-rendering:pixelated}
.num{position:absolute;top:4px;left:6px;background:rgba(0,0,0,.72);color:#fff;
  font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;line-height:1.4;
  font-variant-numeric:tabular-nums;z-index:2}
.nav{background:var(--chip);border:1px solid var(--line);color:var(--fg);border-radius:50%;
  width:46px;height:46px;font-size:22px;cursor:pointer;flex:0 0 auto;font-family:inherit}
.nav:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav:disabled{opacity:.3;cursor:default}
.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;
  background:var(--chip);padding:8px 10px;border-radius:8px;margin-top:10px;color:var(--sub)}
.note{color:var(--sub);font-size:13px}
.hint{background:var(--chip);border-left:3px solid var(--accent);padding:8px 12px;
  border-radius:0 8px 8px 0;font-size:13px;margin:10px 0}
@media(max-width:520px){
  .wrap{padding:8px}
  .nav{width:40px;height:40px;font-size:19px}
  .list{grid-template-columns:1fr 1fr}
  .item{padding:8px 9px;font-size:13px}
  .item b{font-size:13px}
}
</style>

    for(let r=0;r<QSIZE;r++) for(let c=0;c<QSIZE;c++)
      if(!isFunc(r,c)&&MASKS[mid](r,c)) m[r][c]^=1;
    placeFmt(m,mid);
    const p=penalty(m);
    if(!best||p<best[0]) best=[p,m];
  }
  return best[1];
}
function qrSVG(text){
  const m=qrMatrix(text), q=4, n=QSIZE+q*2;
  let d="";
  for(let r=0;r<QSIZE;r++) for(let c=0;c<QSIZE;c++)
    if(m[r][c]) d+=`M${c+q} ${r+q}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">`+
         `<rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* ============ UI ============ */
let VER = Object.keys(DATA).includes("月兎組") ? "月兎組" : Object.keys(DATA)[0];
let CAT = "すべて", Q = "", SEL = null, IDX = 1;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kana = s => s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
                   .replace(/[ 　・（）()]/g,"").toLowerCase();

function verSelect(){
  const sel=$("#ver"); sel.innerHTML="";
  for(const k of Object.keys(DATA)){
    const o=document.createElement("option"); o.value=k; o.textContent=k+"版"; sel.appendChild(o);
  }
  sel.value=VER;
  sel.onchange=()=>{VER=sel.value; SEL=null; render();};
}
function catList(){
  const s=new Set();
  DATA[VER].forEach(x=>(x.cats||[x.cat]).forEach(c=>s.add(c)));
  return ["すべて",...[...s]];
}
function filtered(){
  return DATA[VER].filter(x=>
    (CAT==="すべて"||(x.cats||[x.cat]).includes(CAT)) &&
    (!Q || kana(x.name).includes(kana(Q))));
}
function listHTML(){
  const rows=filtered();
  if(!rows.length) return `<p class="note" style="padding:20px;text-align:center">見つかりませんでした</p>`;
  return rows.map(x=>
    `<button class="item" data-i="${DATA[VER].indexOf(x)}">
       <b>${esc(x.name)}</b>
       <span>${esc((x.cats||[x.cat]).join(" / "))}${x.once?'<i class="tag">1つのみ</i>':''}</span>
     </button>`).join("");
}
function listView(){
  return `
  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="q" placeholder="アイテム名で検索" value="${esc(Q)}" style="flex:1;min-width:160px">
      <span class="note" id="cnt">${filtered().length}件</span>
    </div>
    <div class="cats">${catList().map(c=>
      `<button class="btn ${c===CAT?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  </div>
  <div class="hint">アイテムを選ぶと、そのアイテムがもらえるQRコードを <b>${TOTAL}枚</b> 表示します。
    履歴の上限が500枚なので、${TOTAL}枚を順番に読めば1枚目に戻っても「使用済み」になりません。</div>
  <div class="list" id="list">${listHTML()}</div>`;
}
/* 一覧だけを差し替える(入力欄を作り直さないので日本語入力が壊れない) */
function refreshList(){
  const l=$("#list"); if(!l) return;
  l.innerHTML=listHTML();
  const c=$("#cnt"); if(c) c.textContent=filtered().length+"件";
  bindItems();
}
function bindItems(){
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    SEL=+b.dataset.i; IDX=1; render(); window.scrollTo(0,0);});
}
function qrView(){
  const it=DATA[VER][SEL];
  const total=it.once?1:TOTAL;
  if(IDX>total) IDX=total; if(IDX<1) IDX=1;
  const url=BASE_URL+makeCode(it.serial,IDX);
  return `
  <div class="card">
    <div class="qrtop">
      <button class="btn" id="back">← 一覧</button>
      <div class="name">${esc(it.name)}</div>
      ${it.once?'<span class="tag">1つのみ</span>':
        `<div class="jump"><label class="note" for="jump">番号</label>
         <input id="jump" type="number" min="1" max="${total}" value="${IDX}"> / ${total}</div>`}
    </div>
    <div class="qrbox">
      ${total>1?`<button class="nav" id="prev" ${IDX<=1?"disabled":""}>◀</button>`:""}
      <div class="qrarea">
        <div class="num">${IDX}${total>1?" / "+total:""}</div>
        ${qrSVG(url)}
      </div>
      ${total>1?`<button class="nav" id="next" ${IDX>=total?"disabled":""}>▶</button>`:""}
    </div>
    <div class="url">${esc(url)}</div>
    <div class="note" style="margin-top:8px">
      もらえるもの: ${it.items.map(esc).join(" ＋ ")}　/　シリアル ${it.serial}
      ${it.once?"<br>※1つあれば十分なアイテムのため1枚だけ用意しています。":""}
    </div>
  </div>`;
}
function render(){
  $("#view").innerHTML = SEL===null ? listView() : qrView();
  if(SEL===null){
    const q=$("#q");
    if(q){
      let composing=false;
      q.addEventListener("compositionstart",()=>{composing=true;});
      q.addEventListener("compositionend",()=>{composing=false; Q=q.value; refreshList();});
      q.addEventListener("input",()=>{ if(composing) return;   // 変換中は絞り込まない
        Q=q.value; refreshList(); });
    }
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
      CAT=b.dataset.cat;
      document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x.dataset.cat===CAT));
      refreshList();
    });
    bindItems();
  }else{
    $("#back").onclick=()=>{SEL=null; render();};
    const pv=$("#prev"), nx=$("#next"), jp=$("#jump");
    if(pv) pv.onclick=()=>{IDX--; render();};
    if(nx) nx.onclick=()=>{IDX++; render();};
    if(jp){ jp.onchange=()=>{const v=parseInt(jp.value,10); if(v>=1){IDX=v; render();}};
            jp.onkeydown=e=>{if(e.key==="Enter"){jp.blur(); jp.onchange();}}; }
  }
}
document.addEventListener("keydown",e=>{
  if(SEL===null) return;
  if(document.activeElement && document.activeElement.tagName==="INPUT") return;
  if(e.key==="ArrowLeft"&&IDX>1){IDX--; render();}
  if(e.key==="ArrowRight"){IDX++; render();}
});
$("#theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
};
verSelect(); render();
</script>
