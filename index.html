<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妖怪ウォッチバスターズ 攻略まとめサイト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #fff9e6; color: #333; display: flex; justify-content: center; }
        .menu-box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; box-sizing: border-box; text-align: center; }
        h1 { font-size: 20px; color: #d9534f; border-bottom: 2px solid #d9534f; padding-bottom: 10px; margin-bottom: 25px; }
        
        /* メニューボタンのスタイル */
        .menu-list { list-style: none; padding: 0; margin: 0; }
        .menu-item { margin-bottom: 15px; }
        .menu-item a { display: block; padding: 15px; background: #ff9800; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; box-shadow: 0 3px 0 #e68a00; transition: 0.1s; }
        .menu-item a:active { transform: translateY(3px); box-shadow: none; }
        
        /* 準備中のボタンスタイル */
        .menu-item.disabled { padding: 15px; background: #e0e0e0; color: #888; border-radius: 8px; font-weight: bold; border: 1px dashed #ccc; }
    </style>
</head>
<body>

    <div class="menu-box">
        <h1>妖怪ウォッチバスターズ ツール集</h1>
        
        <ul class="menu-list">
            <li class="menu-item">
                <a href="./damage-calc/">ダメージ計算機を開く</a>
            </li>
            
            <li class="menu-item">
                <div class="disabled">🔒 次のツール（準備中）</div>
            </li>
        </ul>
    </div>

</body>
</html>
